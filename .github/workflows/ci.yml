name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord_bot/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - run: go test ./...
      - run: go build ./...

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - run: go test ./...
      - run: go build ./...

  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/modules/game-server/scripts
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck backup.sh restore.sh tests/stubs/* tests/helper.bash
      # npm publishes bats-core a release or two behind Homebrew; 1.13.0 is its latest.
      - run: sudo npm install -g bats@1.13.0
      - run: bats tests
